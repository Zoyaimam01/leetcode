name: Fetch LeetCode Daily Challenge

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: 

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute Fetcher Script
      run: python fetch_daily.py

    - name: Commit and Push Document
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add daily_challenges/
        
        # Ensures the workflow doesn't crash if it runs twice on the same problem 
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: archiver fetched daily LeetCode challenge" && git push)